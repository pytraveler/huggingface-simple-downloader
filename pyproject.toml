[project]
name = "hf-simple-downloader"
description = "A Tkinter window that lists a Hugging Face repository and downloads the files you pick."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version"]

# httpx and nothing else. The window is stdlib tkinter; the transfer needs a
# client that streams a response and lets redirects be walked by hand, which is
# the one thing urllib makes awkward.
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is written down once, in src/hfdl/__init__.py; the build, the
# window title and the release workflow all read it from there.
[tool.hatch.version]
path = "src/hfdl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hfdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
