name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag and src/hfdl/__init__.py must agree
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/hfdl/__init__.py').read_text()).group(1))")
          echo "tag $GITHUB_REF_NAME -> $tagged, src/hfdl/__init__.py says $declared"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ = \"$declared\" in src/hfdl/__init__.py"
            exit 1
          fi
          echo "VERSION=$tagged" >> "$GITHUB_ENV"

      - name: It compiles, imports and passes its tests
        run: |
          python -m pip install --quiet httpx pytest
          python -m compileall -q src
          PYTHONPATH=src python -c "import hfdl.config, hfdl.fmt, hfdl.hub, hfdl.i18n, hfdl.manager, hfdl.transfer"
          PYTHONPATH=src python -m pytest -q

      - name: Both languages exist for every string
        run: |
          PYTHONPATH=src python - <<'PY'
          import hfdl.i18n as i
          bad = [n for n, t in vars(i).items()
                 if isinstance(t, i.Text) and (not t.en.strip() or not t.ru.strip())]
          assert not bad, f"empty wording: {bad}"
          print(f"{sum(isinstance(t, i.Text) for t in vars(i).values())} strings, both languages")
          PY

      - name: Release notes out of the changelogs
        run: |
          section() { awk -v v="$VERSION" 'index($0, "## " v) == 1 {f=1; next} f && /^## / {exit} f {print}' "$1"; }
          section CHANGELOG.md > /tmp/en.md
          section CHANGELOG.ru.md > /tmp/ru.md
          if [ ! -s /tmp/en.md ] || [ ! -s /tmp/ru.md ]; then
            echo "::error::no section for $VERSION in CHANGELOG.md or CHANGELOG.ru.md"
            exit 1
          fi
          { cat /tmp/en.md; echo; echo "---"; echo; cat /tmp/ru.md; } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Pack the archive
        run: |
          name="huggingface-simple-downloader-$VERSION"
          mkdir -p dist
          git archive --format=zip --prefix="$name/" -o "dist/$name.zip" "$GITHUB_REF_NAME"
          unzip -l "dist/$name.zip"
          echo "ARCHIVE=dist/$name.zip" >> "$GITHUB_ENV"
          echo "PREFIX=$name" >> "$GITHUB_ENV"

      - name: The scripts in the archive have the line endings their shell needs
        run: |
          for launcher in HF_Downloader.bat install.bat lang.bat logo.bat; do
            unzip -p "$ARCHIVE" "$PREFIX/$launcher" > /tmp/script
            lines=$(wc -l < /tmp/script)
            crlf=$(grep -c $'\r$' /tmp/script || true)
            echo "$launcher: $lines lines, $crlf of them CRLF"
            if [ "$lines" -eq 0 ] || [ "$lines" != "$crlf" ]; then
              echo "::error::$launcher is not CRLF in $ARCHIVE - check .gitattributes"
              exit 1
            fi
          done
          for script in HF_Downloader.sh install.sh lang.sh logo.sh; do
            unzip -p "$ARCHIVE" "$PREFIX/$script" > /tmp/script
            crlf=$(grep -c $'\r$' /tmp/script || true)
            echo "$script: $(wc -l < /tmp/script) lines, $crlf of them CRLF"
            if [ "$crlf" != "0" ]; then
              echo "::error::$script carries CRLF in $ARCHIVE - check .gitattributes"
              exit 1
            fi
          done

      - name: The shell scripts parse
        run: |
          for script in HF_Downloader.sh install.sh logo.sh; do
            bash -n "$script" && echo "$script ok"
          done
          ( . ./lang.sh && [ -n "$LC" ] && echo "lang.sh sets LC=$LC" ) || exit 1

      - name: What is in the archive, and what is not
        run: |
          listed=$(unzip -Z1 "$ARCHIVE")
          echo "$listed"
          for bad in "/uv$" "/uv\.exe$" "settings\.json" "downloader\.log" "\.venv/" "\.github/" "\.part$"; do
            if echo "$listed" | grep -qE -- "$bad"; then
              echo "::error::$ARCHIVE contains something matching $bad"
              exit 1
            fi
          done
          for needed in HF_Downloader.bat install.bat lang.bat logo.bat \
                        HF_Downloader.sh install.sh lang.sh logo.sh \
                        pyproject.toml uv.lock \
                        src/hfdl/app.py src/hfdl/transfer.py src/hfdl/hub.py \
                        README.md README.ru.md CHANGELOG.md LICENSE; do
            echo "$listed" | grep -qxF "$PREFIX/$needed" || {
              echo "::error::$needed is missing from $ARCHIVE"
              exit 1
            }
          done
          echo "checked: the launchers and the package are in, the local state is not"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" \
            --title "HuggingFace Simple Downloader $VERSION" \
            --notes-file /tmp/notes.md \
            --verify-tag
